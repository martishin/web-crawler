services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: local
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d local"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pg_data:/var/lib/postgresql/data

  api:
    image: web-crawler
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8100}
      # when running api in docker network, use db hostname:
      PG_DSN: ${PG_DSN:-postgres://root:1234@db:5432/local?sslmode=disable}
    ports:
      - "${PORT:-8100}:${PORT:-8100}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
